<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
    <script src="calculator.js"></script>

</head>
<body>
    <div class ="calculator">
         <div class ="title"><pre>     CALCULATOR</pre></div> 
            <input type="text" id="display">
         <div class="buttons">
            <button class="col" onclick="ClearAc()">AC</button>
            <button class="col" onclick="addValue('%')">%</button>
            <button class="col" onclick="DeleteOne()">Back</button>
            <button class="col" onclick="addValue('/')">/</button>
            <button onclick="addValue('7')">7</button>
            <button onclick="addValue('8')">8</button>
            <button onclick="addValue('9')">9</button>
            <button class="col" onclick="addValue('x')">X</button>
            <button onclick="addValue('4')">4</button>
            <button onclick="addValue('5')">5</button>
            <button onclick="addValue('6')">6</button>
            <button class="col" onclick="addValue('-')">-</button>
            <button onclick="addValue('1')">1</button>
            <button onclick="addValue('2')">2</button>
            <button onclick="addValue('3')">3</button>
            <button class="col" onclick="addValue('+')">+</button>
            <button onclick="addValue('00')">00</button>
            <button onclick="addValue('0')">0</button>
            <button onclick="addValue('.')">.</button>
            <button class="col" onclick="Tocalculate()">=</button>
        </div>
        </div>
    </body>
</html>
